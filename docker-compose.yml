version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: qma-redis
    ports:
      - "6379:6379"
    networks:
      - qma-network

  mysql:
    image: mysql:8
    container_name: qma-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-Alan@2004}
      - MYSQL_DATABASE=quantitymeasurementdb
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - qma-network

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=${DB_HOST:-mysql}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-Alan@2004}
      - JWT_SECRET=${JWT_SECRET:-dGVzdGRHVnpkR1JsYzNSbFpHVnlkR2x1WjNOaFkzSmxkR2x2YmkxclpYaz0=}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-3600000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - OAUTH2_REDIRECT_URI=${OAUTH2_REDIRECT_URI:-http://localhost:5173/oauth2-success}
    depends_on:
      - mysql
    networks:
      - qma-network

  qma-service:
    build: ./qma-service
    container_name: qma-service
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=${DB_HOST:-mysql}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-Alan@2004}
      - JWT_SECRET=${JWT_SECRET:-dGVzdGRHVnpkR1JsYzNSbFpHVnlkR2x1WjNOaFkzSmxkR2x2YmkxclpYaz0=}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-3600000}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    depends_on:
      - mysql
      - redis
    networks:
      - qma-network

  api-gateway-service:
    build: ./api-gateway-service
    container_name: api-gateway-service
    ports:
      - "8080:8080"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8081
      - QMA_SERVICE_URL=http://qma-service:8082
    depends_on:
      - auth-service
      - qma-service
    networks:
      - qma-network

  frontend:
    build:
      context: ../QuantityMeasurementApp-Frontend-
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
    container_name: qma-frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway-service
    networks:
      - qma-network

networks:
  qma-network:
    driver: bridge

volumes:
  mysql-data: