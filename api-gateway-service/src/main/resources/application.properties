server.port=8080
spring.application.name=api-gateway-service

spring.mvc.dispatch-options-request=true

# Fix for OAuth2 callback query parameters containing '='
spring.cloud.gateway.proxy.preserve-host-header=true

# Encoding settings
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Auth service routes
spring.cloud.gateway.mvc.routes[0].id=auth-service-auth
spring.cloud.gateway.mvc.routes[0].uri=http://auth-service:8081
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.mvc.routes[1].id=auth-service-oauth2
spring.cloud.gateway.mvc.routes[1].uri=http://auth-service:8081
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/oauth2/**

spring.cloud.gateway.mvc.routes[2].id=auth-service-login-oauth2
spring.cloud.gateway.mvc.routes[2].uri=http://auth-service:8081
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/login/oauth2/**

# QMA service routes
spring.cloud.gateway.mvc.routes[3].id=qma-service
spring.cloud.gateway.mvc.routes[3].uri=http://qma-service:8082
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/quantities/**

# CORS Configuration
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true